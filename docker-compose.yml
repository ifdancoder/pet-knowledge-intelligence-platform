services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kip
      POSTGRES_PASSWORD: kip
      POSTGRES_DB: kip
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kip
      RABBITMQ_DEFAULT_PASS: kip
    networks:
      - default

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    networks:
      - default

  minio:
    image: minio/minio
    command: server /data --console-address ":9091"
    ports:
      - "9000:9000"
      - "9091:9091"
    environment:
      MINIO_ROOT_USER: kip
      MINIO_ROOT_PASSWORD: kipkipkip
    volumes:
      - minio_data:/data
    networks:
      - default

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - default

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  minio_data:
  ollama_data:
