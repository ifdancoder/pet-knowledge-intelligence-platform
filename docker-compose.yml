services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kip
      POSTGRES_PASSWORD: kip
      POSTGRES_DB: kip
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kip"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kip
      RABBITMQ_DEFAULT_PASS: kip
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  minio:
    # minio/minio was deleted from Docker Hub on 2026-09-11; Chainguard mirrors
    # the same upstream binary with anonymous pulls still open.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9091"
    ports:
      - "9000:9000"
      - "9091:9091"
    environment:
      MINIO_ROOT_USER: kip
      MINIO_ROOT_PASSWORD: kipkipkip
    volumes:
      - minio_data:/data
    networks:
      - default

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - default

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - default

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kip:kip@postgres:5432/kip
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      RABBITMQ_URL: amqp://kip:kip@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: kip
      S3_SECRET_KEY: kipkipkip
      S3_BUCKET: sources
      ELASTICSEARCH_URL: http://elasticsearch:9200
      EMBEDDING_PROVIDER: local
      EMBEDDING_DEVICE: cuda
      RERANKER_DEVICE: cuda
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: local
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: claude-sonnet-5
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9001"
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default

  worker:
    build: .
    command: celery -A worker worker --pool=solo --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kip:kip@postgres:5432/kip
      SYNC_DATABASE_URL: postgresql+psycopg2://kip:kip@postgres:5432/kip
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      RABBITMQ_URL: amqp://kip:kip@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: kip
      S3_SECRET_KEY: kipkipkip
      S3_BUCKET: sources
      ELASTICSEARCH_URL: http://elasticsearch:9200
      EMBEDDING_PROVIDER: local
      EMBEDDING_DEVICE: cuda
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  minio_data:
  ollama_data:
