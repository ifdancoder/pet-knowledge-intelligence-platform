services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kip
      POSTGRES_PASSWORD: kip
      POSTGRES_DB: kip
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
