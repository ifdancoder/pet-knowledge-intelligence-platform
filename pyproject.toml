[project]
name = "knowledge-intelligence-platform"
version = "0.1.0"
description = "Backend for ingesting, indexing, and querying personal knowledge sources"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-ulid>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.3.0",
    "celery>=5.6.3",
    "boto3>=1.43.108",
    "elasticsearch>=8.15,<9",
    "redis>=8.1.0",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
    "openai>=3.24.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "python-multipart>=0.0.32",
    "anthropic>=1.11.0",
    "ollama>=0.6.3",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-celery>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[minio,postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "boto3-stubs[s3]>=1.43.108",
    "fakeredis[lua]>=2.39.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Header()/Path() in argument defaults is the
# documented, idiomatic pattern — not the mutable-default-argument bug
# this rule exists to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# opentelemetry-instrumentation-celery ships no py.typed marker, so its
# BaseInstrumentor.instrument() is seen as untyped under strict mode no
# matter how the call site is annotated.
module = "infrastructure.observability.tracing"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Celery's @app.task has no type stubs, so its decorated functions are
# untyped under strict mode no matter how the function itself is annotated.
module = "presentation.tasks.ingestion"
disallow_untyped_decorators = false
