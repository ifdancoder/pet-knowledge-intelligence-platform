apiVersion: v1
kind: ConfigMap
metadata:
  name: kip-config
  namespace: kip
data:
  DATABASE_URL: postgresql+asyncpg://kip:kip@postgres.kip.svc.cluster.local:5432/kip
  SYNC_DATABASE_URL: postgresql+psycopg2://kip:kip@postgres.kip.svc.cluster.local:5432/kip
  RABBITMQ_URL: amqp://kip:kip@rabbitmq.kip.svc.cluster.local:5672//
  REDIS_URL: redis://redis.kip.svc.cluster.local:6379/0
  S3_ENDPOINT_URL: http://minio.kip.svc.cluster.local:9000
  S3_BUCKET: sources
  ELASTICSEARCH_URL: http://elasticsearch.kip.svc.cluster.local:9200
  EMBEDDING_PROVIDER: local
  EMBEDDING_DEVICE: cuda
  RERANKER_DEVICE: cuda
  LLM_PROVIDER: local
  OLLAMA_URL: http://ollama.kip.svc.cluster.local:11434
  OLLAMA_MODEL: llama3.2:1b
  ANTHROPIC_MODEL: claude-sonnet-5
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.kip.svc.cluster.local:4317
  METRICS_PORT: "9001"
