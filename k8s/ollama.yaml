apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: kip
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: kip
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
