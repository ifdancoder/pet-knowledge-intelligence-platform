apiVersion: v1
kind: ConfigMap
metadata:
  name: kip-config
  namespace: kip
data:
  REDIS_URL: redis://redis.kip.svc.cluster.local:6379/0
  S3_ENDPOINT_URL: http://minio.kip.svc.cluster.local:9000
  S3_BUCKET: sources
  ELASTICSEARCH_URL: http://elasticsearch.kip.svc.cluster.local:9200
  EMBEDDING_PROVIDER: local
  EMBEDDING_DEVICE: cpu
  RERANKER_DEVICE: cpu
  LLM_PROVIDER: local
  OLLAMA_URL: http://ollama.kip.svc.cluster.local:11434
  OLLAMA_MODEL: smollm2:135m
  ANTHROPIC_MODEL: claude-sonnet-5
  # No Tempo/Prometheus/Grafana on this node (too little RAM/CPU to spare on
  # a shared single-core VPS). Disabling the OTel SDK outright, rather than
  # just dropping the OTLP endpoint, stops it from even trying to export.
  OTEL_SDK_DISABLED: "true"
  METRICS_PORT: "9001"
  FRONTEND_ORIGIN: https://knowledge.ifdancoder.ru
