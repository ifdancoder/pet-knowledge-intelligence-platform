# "__TAG__" in the image reference below is substituted by the deploy workflow
# (.github/workflows/deploy.yml) with the git commit SHA, so the pod spec
# actually changes on every deploy and triggers a real rollout. There is no
# registry: the image must already be imported into the node's containerd
# before this is applied, hence imagePullPolicy: Never.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kip-frontend:__TAG__
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kip
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
