apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: kip
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          # Pulls the configured model on every pod start. Idempotent: once the
          # model is already in the PVC, `ollama pull` is a quick no-op cache
          # check, not a redownload. `|| true` keeps a transient pull failure
          # (e.g. no network yet) from failing the postStart hook itself, which
          # would otherwise kill and restart an already-healthy container.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      ollama list >/dev/null 2>&1 && break
                      sleep 1
                    done
                    ollama pull smollm2:135m || true
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 768Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: kip
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
