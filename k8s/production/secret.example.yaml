# Documentation of kip-secrets' shape only. Named kip-secrets-example (not
# kip-secrets) so that `kubectl apply -f k8s/production/` can never overwrite
# the real Secret deploy.yml creates with these empty placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: kip-secrets-example
  namespace: kip
stringData:
  POSTGRES_USER: kip
  POSTGRES_PASSWORD: ""
  RABBITMQ_DEFAULT_USER: kip
  RABBITMQ_DEFAULT_PASS: ""
  S3_ACCESS_KEY: kip
  S3_SECRET_KEY: ""
  JWT_SECRET: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  SENTRY_DSN: ""
  DATABASE_URL: ""
  SYNC_DATABASE_URL: ""
  RABBITMQ_URL: ""
