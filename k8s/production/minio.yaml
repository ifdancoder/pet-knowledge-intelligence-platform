apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: kip
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # MinIO deleted minio/minio from Docker Hub (2026-09-11) and then locked down
          # quay.io/minio/minio to anonymous pulls too. Chainguard mirrors the same
          # upstream binary with anonymous pulls still open; same entrypoint/args/env
          # contract as the original image, verified by running it directly.
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9091"]
          ports:
            - containerPort: 9000
            - containerPort: 9091
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: kip-secrets, key: S3_ACCESS_KEY}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: kip-secrets, key: S3_SECRET_KEY}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: kip
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9091
      targetPort: 9091
