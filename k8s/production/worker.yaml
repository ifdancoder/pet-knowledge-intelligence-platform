apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: kip:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "worker", "worker", "--pool=solo", "--loglevel=info"]
          envFrom:
            - configMapRef: {name: kip-config}
          env:
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: kip-secrets, key: JWT_SECRET}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: kip-secrets, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: kip-secrets, key: S3_SECRET_KEY}}
            - name: SENTRY_DSN
              valueFrom: {secretKeyRef: {name: kip-secrets, key: SENTRY_DSN}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: kip-secrets, key: DATABASE_URL}}
            - name: SYNC_DATABASE_URL
              valueFrom: {secretKeyRef: {name: kip-secrets, key: SYNC_DATABASE_URL}}
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: kip-secrets, key: RABBITMQ_URL}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1536Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kip
spec:
  selector:
    app: worker
  ports:
    - port: 9001
      targetPort: 9001
