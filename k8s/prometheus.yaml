apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kip
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: kip-api
        static_configs:
          - targets: ["api.kip.svc.cluster.local:8000"]
        metrics_path: /metrics

      - job_name: kip-worker
        static_configs:
          - targets: ["worker.kip.svc.cluster.local:9001"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kip
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
