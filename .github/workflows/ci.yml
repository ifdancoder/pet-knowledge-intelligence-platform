name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    env:
      # No Tempo in CI, and nothing here asserts on exported trace content,
      # so the SDK would otherwise just log noisy, harmless connection-refused
      # errors on every export attempt.
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups
      - name: Unit tests
        run: uv run pytest -v -m "not integration"
      - name: Integration tests (Testcontainers)
        run: uv run pytest -v -m integration
