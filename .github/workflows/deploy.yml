name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build images
        run: |
          docker build -t kip:${{ github.event.workflow_run.head_sha }} .
          docker build -t kip-frontend:${{ github.event.workflow_run.head_sha }} ./frontend

      - name: Import images into containerd
        run: |
          docker save kip:${{ github.event.workflow_run.head_sha }} | sudo k3s ctr images import -
          docker save kip-frontend:${{ github.event.workflow_run.head_sha }} | sudo k3s ctr images import -

      - name: Apply namespace
        run: kubectl apply -f k8s/production/namespace.yaml

      - name: Write production secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          kubectl create secret generic kip-secrets -n kip \
            --from-literal=POSTGRES_USER=kip \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=RABBITMQ_DEFAULT_USER=kip \
            --from-literal=RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASSWORD" \
            --from-literal=S3_ACCESS_KEY=kip \
            --from-literal=S3_SECRET_KEY="$S3_SECRET_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=OPENAI_API_KEY="" \
            --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
            --from-literal=SENTRY_DSN="${SENTRY_DSN:-}" \
            --from-literal=DATABASE_URL="postgresql+asyncpg://kip:${POSTGRES_PASSWORD}@postgres.kip.svc.cluster.local:5432/kip" \
            --from-literal=SYNC_DATABASE_URL="postgresql+psycopg2://kip:${POSTGRES_PASSWORD}@postgres.kip.svc.cluster.local:5432/kip" \
            --from-literal=RABBITMQ_URL="amqp://kip:${RABBITMQ_PASSWORD}@rabbitmq.kip.svc.cluster.local:5672//" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tags for this deploy
        run: |
          sed -i "s/__TAG__/${{ github.event.workflow_run.head_sha }}/g" \
            k8s/production/api.yaml k8s/production/worker.yaml k8s/production/frontend.yaml

      - name: Apply manifests
        run: kubectl apply -f k8s/production/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n kip --timeout=120s
          kubectl rollout status deployment/worker -n kip --timeout=120s
          kubectl rollout status deployment/frontend -n kip --timeout=60s

      - name: Drop the build-local copies
        if: always()
        run: |
          docker rmi kip:${{ github.event.workflow_run.head_sha }} kip-frontend:${{ github.event.workflow_run.head_sha }} || true

      - name: Prune old images
        if: always()
        run: |
          # Every deploy imports a new per-SHA image into k3s's own containerd
          # store but never removes the previous one. Left unchecked, that
          # store (and Docker's own build cache) grows until the node trips
          # kubelet's disk-pressure eviction threshold mid-deploy. --prune
          # only removes images no longer referenced by any pod, so this is
          # safe even while the previous deployment's pods are still rolling.
          sudo k3s crictl rmi --prune || true
          docker image prune -af || true
          docker builder prune -af || true
